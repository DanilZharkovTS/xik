services:
  postgres:
    image: postgres:16-alpine
    container_name: xik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: xik_db
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xik_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Локальне S3-сумісне сховище для зображень статей (у продакшні це S3, R2 тощо).
  minio:
    image: quay.io/minio/minio
    container_name: xik-minio
    restart: unless-stopped
    # Лише для завантаження зображень блогу: docker compose --profile storage up -d
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: xik
      MINIO_ROOT_PASSWORD: xik-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker/minio/data:/data
    networks:
      - app-network

  # Одноразово створює відкритий для читання bucket.
  minio-init:
    image: quay.io/minio/mc
    container_name: xik-minio-init
    profiles: ["storage"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 xik xik-minio-secret; do sleep 1; done;
      mc mb -p local/xik-media;
      mc anonymous set download local/xik-media;
      exit 0"
    networks:
      - app-network

  notifications:
    container_name: xik-notifications
    build:
      context: ./notification_service
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - ./notification_service/.env
    environment:
      PORT: 3002
    volumes:
      - ./notification_service:/app
      - /app/node_modules
    networks:
      - app-network

  backend:
    container_name: xik-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5001
      DATABASE_URL: "postgresql://postgres:1234@postgres:5432/xik_db"
      FRONTEND_URL: "http://localhost:3000"
      FRONTEND_INTERNAL_URL: "http://frontend:3000"
      REVALIDATE_SECRET: "local-dev-revalidate-secret"
      NOTIFICATIONS_SERVICE_URL: "http://notifications:3002"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "xik-media"
      S3_ACCESS_KEY_ID: "xik"
      S3_SECRET_ACCESS_KEY: "xik-minio-secret"
      # Адреса файлів у браузері (не внутрішня адреса Docker-мережі).
      S3_PUBLIC_URL: "http://localhost:9000/xik-media"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      notifications:
        condition: service_started
    networks:
      - app-network

  frontend:
    container_name: xik-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:5001"
      # Сервер Next.js ходить у бекенд за внутрішньою адресою Docker-мережі.
      API_INTERNAL_URL: "http://backend:5001"
      REVALIDATE_SECRET: "local-dev-revalidate-secret"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
