services:
  postgres:
    image: postgres:16-alpine
    container_name: xik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: xik_db
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xik_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  notifications:
    container_name: xik-notifications
    build:
      context: ./notification_service
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - ./notification_service/.env
    environment:
      PORT: 3002
    volumes:
      - ./notification_service:/app
      - /app/node_modules
    networks:
      - app-network

  backend:
    container_name: xik-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5001
      DATABASE_URL: "postgresql://postgres:1234@postgres:5432/xik_db"
      FRONTEND_URL: "http://localhost:3000"
      NOTIFICATIONS_SERVICE_URL: "http://notifications:3002"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      notifications:
        condition: service_started
    networks:
      - app-network

  frontend:
    container_name: xik-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:5001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
