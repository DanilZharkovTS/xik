services:
  postgres:
    image: postgres:16-alpine
    container_name: xik-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-xik_db}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-xik_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  notifications:
    container_name: xik-notifications-prod
    build:
      context: ./notification_service
      dockerfile: Dockerfile
      target: prod
    restart: always
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      SERVICE_TOKEN: ${NOTIFICATIONS_SERVICE_SECRET}
    networks:
      - app-network

  backend:
    container_name: xik-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    restart: always
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres_secure_password@postgres:5432/xik_db}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
      SUBSCRIPTION_SERVICE_KEY: ${SUBSCRIPTION_SERVICE_KEY}
      NOTIFICATIONS_SERVICE_URL: ${NOTIFICATIONS_SERVICE_URL:-http://notifications:3002}
      NOTIFICATIONS_SERVICE_SECRET: ${NOTIFICATIONS_SERVICE_SECRET}
      STRIPE_SECRET: ${STRIPE_SECRET}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Europe/Kyiv}
      OUTREACH_RATE_LIMIT: ${OUTREACH_RATE_LIMIT:-30}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
    depends_on:
      postgres:
        condition: service_healthy
      notifications:
        condition: service_started
    networks:
      - app-network

  frontend:
    container_name: xik-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:5001}
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
